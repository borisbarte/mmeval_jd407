[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "borisbarte-mmeval_jd407"
version = "0.1.0"
description = "从样本里推断多模态评测工程师·重排模型的候选截断应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "borisbarte" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://borisbarte.github.io"
Repository = "https://github.com/borisbarte/mmeval_jd407"
Issues = "https://github.com/borisbarte/mmeval_jd407/issues"

[project.scripts]
mmeval_jd407 = "mmeval_jd407:main"

[tool.setuptools]
py-modules = ["mmeval_jd407"]
